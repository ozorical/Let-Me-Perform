name: Build

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.*"]
  pull_request:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install the tools
        run: python -m pip install --upgrade pip build pytest ruff tomlkit

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q

      - name: Build the wheel
        run: python -m build --wheel

      - name: Install it beside Endstone
        run: |
          python -m pip install endstone
          python -m pip install --no-deps dist/*.whl
          python -c "import endstone, endstone_let_me_perform; print('Endstone', endstone.__version__, 'loads', endstone_let_me_perform.LetMePerform.__name__)"

      - uses: actions/upload-artifact@v4
        with:
          name: let-me-perform-${{ matrix.os }}-python-${{ matrix.python }}
          path: dist/*.whl
          if-no-files-found: error

  publish:
    name: Publish
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Release the tagged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*.whl
          --title "Let Me Perform $GITHUB_REF_NAME"
          --notes "One wheel for every platform Endstone runs on: Windows and Linux, Python 3.11 to 3.14. Drop it into the plugins folder and restart the server. See CHANGELOG.md for what changed."

      - name: Refresh the development build
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev dist/*.whl --prerelease --target "$GITHUB_SHA" --title "Development build" --notes "Built from the newest commit on main, $GITHUB_SHA. One wheel for every platform Endstone runs on: Windows and Linux, Python 3.11 to 3.14. It passed the tests on all of them, but it has not been through a release, so expect rough edges."
